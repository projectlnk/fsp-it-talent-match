services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FSP_BASE_URL: http://mini-fsp-id:8000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readiness')"]
      interval: 5s
      timeout: 5s
      retries: 12
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  mini-fsp-id:
    build: .
    command: ["uvicorn", "mock_fsp.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${FSP_PORT:-8001}:8000"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
volumes:
  postgres_data:
