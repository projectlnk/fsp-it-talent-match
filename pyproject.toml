[project]
name = "minimal-fsp-template"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "bcrypt>=4.2,<5",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.18,<1",
    "email-validator>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-playwright>=0.7,<1", "pyyaml>=6,<7"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires Compose services", "e2e: requires app and Chromium"]
