{% from 'matching/_filter_fields.html' import search_fields %}
<fieldset class="card team-need-position" data-need-position><legend>Позиция <span data-position-number>{{ index + 1 if index is number else '' }}</span></legend><input type="hidden" name="position_index" value="{{ index }}"><label>Название позиции<input name="position_{{ index }}_name" value="{{ p.name }}" maxlength="255" required placeholder="Например, Backend Middle"></label><div class="form">{{ search_fields(p.filters, specializations, grades, work_format_labels, 'position_' ~ index ~ '_') }}</div><button class="button button-quiet button-small" type="button" data-remove-position>Убрать позицию</button></fieldset>
