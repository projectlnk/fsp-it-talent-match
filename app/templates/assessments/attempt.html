{% extends "base.html" %}
{% block content %}<p class="eyebrow">Кабинет кандидата / Тестирование</p>
<h1>Тест: {{ spec.name }} / {{ grade.name }}</h1>
<div class="question-meta"><span>Вопрос {{ answered_count + 1 }} из {{ total }}</span><span>Ответы сохраняются</span></div><div class="progress-track" role="progressbar" aria-label="Прогресс теста" aria-valuenow="{{ answered_count }}" aria-valuemin="0" aria-valuemax="{{ total }}"><span style="width:{{ answered_count / total * 100 if total else 0 }}%"></span></div>

<div class="question-box">
  <p class="question-text">{{ current.text }}</p>
  <form method="post" action="/assessments/attempt/{{ attempt.id }}/answer" class="form">
    <input type="hidden" name="answer_id" value="{{ current.answer_id }}">
    <div class="options">
      {% for opt in current.options %}
        <label class="option">
          <input type="radio" name="value" value="{{ opt }}" required>
          <span>{{ opt }}</span>
        </label>
      {% endfor %}
    </div>
    <button type="submit">Ответить и продолжить</button>
  </form>
</div>
{% endblock %}
