{% extends 'career/base.html' %}{% block career_content %}<h1>{{ 'Потребность команды' if kind == 'need' else 'Вакансия' }}</h1><p class="muted">Существенные требования можно изменять первые 14 дней. Описание, зарплата и связь редактируются постоянно.</p>{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
<section class="card"><form method="post" action="/career/opportunities/save" class="form"><input type="hidden" name="token" value="{{ csrf_token }}"><input type="hidden" name="kind" value="{{ kind }}"><input type="hidden" name="id" value="{{ item.id if item and item.id else '' }}">
<label>Название / роль<input name="title" required minlength="2" maxlength="255" value="{{ item.title if item else '' }}"></label><label>Задачи и существенные условия<textarea name="description" required minlength="10" maxlength="10000" rows="5">{{ item.description if item else '' }}</textarea></label>
<div class="form-row"><label>Специализация<select name="specialization" required>{% for s in specializations %}<option value="{{ s.code }}" {% if item and item.specialization == s.code %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></label><label>Грейд<select name="grade" required>{% for g in grades %}<option value="{{ g.code }}" {% if item and item.grade == g.code %}selected{% endif %}>{{ g.name }}</option>{% endfor %}</select></label></div>
<label>Навыки через запятую<input name="skills" maxlength="2000" value="{{ item.skills if item else '' }}"></label><div class="form-row"><label>Зарплата от, ₽<input type="number" name="salary_from" min="0" required value="{{ item.salary_from if item else 0 }}"></label><label>Зарплата до, ₽<input type="number" name="salary_to" min="0" required value="{{ item.salary_to if item else 0 }}"></label></div>
<label>Формат работы<select name="work_format">{% for value,label in [('office','Офис'),('remote','Удалённо'),('hybrid','Гибрид')] %}<option value="{{ value }}" {% if item and item.work_format == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Способ связи<input name="contact_method" required minlength="3" maxlength="255" value="{{ item.contact_method if item else '' }}"></label><button>Сохранить</button></form></section>{% endblock %}
