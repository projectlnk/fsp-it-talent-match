{% macro test_tabs(tab='recommended') %}<nav class="section-tabs" aria-label="Тесты">{% for key,label in [('recommended','Рекомендуемое'),('progress','В процессе'),('results','Результаты')] %}<a href="/assessments?tab={{ key }}" {% if key == tab %}class="active" aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav>{% endmacro %}
{% macro connection_tabs(calendar=false) %}<nav class="section-tabs" aria-label="Связь"><a href="/career/connections" {% if not calendar %}class="active" aria-current="page"{% endif %}>Чаты</a><a href="/career/meetings" {% if calendar %}class="active" aria-current="page"{% endif %}>Календарь</a></nav>{% endmacro %}
